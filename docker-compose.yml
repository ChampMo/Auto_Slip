# ไม่ต้องมี version: อีกแล้ว — Docker Compose รุ่นใหม่เลิกใช้และจะเตือนทุกครั้งที่รัน
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # ⚠️ การเปลี่ยนรหัสผ่านตรงนี้จะไม่มีผลกับ volume ที่สร้างไปแล้ว
      # Postgres ตั้งรหัสผ่านแค่ตอน init ครั้งแรกเท่านั้น ถ้าจะเปลี่ยนจริงต้องลบ volume ด้วย
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-autoslip_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # ผูกกับ localhost เท่านั้น ถ้าเครื่องนี้มี public IP จะได้ไม่เปิดฐานข้อมูลออกอินเทอร์เน็ต
      - "127.0.0.1:5432:5432"

  bot:
    build: .
    restart: always
    depends_on:
      - db
    volumes:
      - ./.env:/app/.env
      - ./credentials.json:/app/credentials.json
    # นำ .env โยนเข้าไปใน Container ด้วย
    env_file:
      - .env

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-password1234}
    ports:
      # เข้าผ่าน http://localhost:5050 เท่านั้น ไม่เปิดออกอินเทอร์เน็ต
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  pgdata:
  pgadmin_data:
